<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Perpetua Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap">
<style>
/* ════════════════════════════════════════════════════════════════════════
   Perpetua console — palette from the app's own theme.css, rebuilt on one
   type scale, one spacing scale and one control height.
   ═══════════════════════════════════════════════════════════════════════ */
:root{
  color-scheme: light;
  --font-ui:"DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;

  /* ── type · six steps, nothing off-scale ─────────────────────────────── */
  --t-xs:.6875rem;   /* 11 · uppercase labels, units */
  --t-sm:.8125rem;   /* 13 · secondary, table cells */
  --t-md:.9375rem;   /* 15 · body, the default */
  --t-lg:1.125rem;   /* 18 · panel + dialog titles */
  --t-xl:1.5rem;     /* 24 · page titles */
  --t-2xl:2.5rem;    /* 40 · stat figures */

  /* ── spacing · 4/8/12/16/24/32 ───────────────────────────────────────── */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px;

  /* ── ink · three levels, each with one job ───────────────────────────── */
  --ink:#0A0A0A;      /* titles, values            · 16:1 */
  --ink-2:#525252;    /* supporting text, meta     ·  8:1 */
  --ink-3:#A3A3A3;    /* units, timestamps, disabled only */
  --ink-inverse:#F5F5F5;

  --ground:#F5F5F5; --surface:#FFFFFF; --surface-2:#FAFAFA; --surface-3:#EFEFEF;
  --rule:#E5E5E5; --rule-strong:#D4D4D4;
  --warn:#8F6410; --warn-dim:#FDF5E3; --warn-edge:#E2CB93;
  --danger:#C33720; --danger-dim:#FDECE9; --danger-edge:#EDB9AF;
  --ok:#22C55E;
  --scrim:rgba(0,0,0,.45);
  --live-tint:#EFEFEF; --live-edge:#E5E5E5; --live-ink:#0A0A0A;
  --fill:#0A0A0A; --fill-hover:#2E2E2E;
  --shadow-card:0 1px 2px rgba(0,0,0,.04);
  --shadow-raised:0 8px 32px rgba(0,0,0,.08);
  --shadow-modal:0 20px 48px rgba(0,0,0,.20);
  --hover:rgba(0,0,0,.035);

  /* ── shape and controls · one height, one radius set ─────────────────── */
  --r-sm:8px; --r-md:12px; --r-lg:14px; --r-pill:999px;
  --ctl:36px;          /* every button, field and icon button */
  --bw:1.5px;          /* control edges */
  --topbar:64px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --ink:#FAFAFA; --ink-2:#B4B4B4; --ink-3:#737373; --ink-inverse:#0A0A0A;
    --ground:#0A0A0A; --surface:#171717; --surface-2:#131313; --surface-3:#1E1E1E;
    --rule:#2A2A2A; --rule-strong:#3A3A3A;
    --warn:#E3B341; --warn-dim:#2A2113; --warn-edge:#4A3A14;
    --danger:#F4553D; --danger-dim:#2A1512; --danger-edge:#5A2A22;
    --scrim:rgba(0,0,0,.72);
    --live-tint:#1E1E1E; --live-edge:#2A2A2A; --live-ink:#FAFAFA;
    --fill:#FAFAFA; --fill-hover:#FFFFFF;
    --shadow-card:0 1px 2px rgba(0,0,0,.5);
    --shadow-raised:0 4px 8px rgba(0,0,0,.4),0 12px 24px rgba(0,0,0,.5);
    --shadow-modal:0 20px 48px rgba(0,0,0,.7);
    --hover:rgba(255,255,255,.04);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --ink:#FAFAFA; --ink-2:#B4B4B4; --ink-3:#737373; --ink-inverse:#0A0A0A;
  --ground:#0A0A0A; --surface:#171717; --surface-2:#131313; --surface-3:#1E1E1E;
  --rule:#2A2A2A; --rule-strong:#3A3A3A;
  --warn:#E3B341; --warn-dim:#2A2113; --warn-edge:#4A3A14;
  --danger:#F4553D; --danger-dim:#2A1512; --danger-edge:#5A2A22;
  --scrim:rgba(0,0,0,.72);
  --live-tint:#1E1E1E; --live-edge:#2A2A2A; --live-ink:#FAFAFA;
  --fill:#FAFAFA; --fill-hover:#FFFFFF;
  --shadow-card:0 1px 2px rgba(0,0,0,.5);
  --shadow-raised:0 4px 8px rgba(0,0,0,.4),0 12px 24px rgba(0,0,0,.5);
  --shadow-modal:0 20px 48px rgba(0,0,0,.7);
  --hover:rgba(255,255,255,.04);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:var(--font-ui); font-size:var(--t-md); line-height:1.45;
  -webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums;
}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
[hidden]{display:none!important}
svg{flex:none}


/* ── uppercase label · the one small-caps style in the system ─────────── */
.label{
  font-size:var(--t-xs); letter-spacing:.12em; text-transform:uppercase;
  color:var(--ink-2); font-weight:500
}
.sub{color:var(--ink-2); font-size:var(--t-sm)}      /* supporting text */
.meta{color:var(--ink-3); font-size:var(--t-sm)}     /* units, timestamps only */

/* ══ top bar ═══════════════════════════════════════════════════════════ */
.topbar{
  position:sticky;top:0;z-index:40;height:var(--topbar);
  display:flex;align-items:center;gap:var(--s3);
  padding-inline:var(--s5);background:var(--surface);border-bottom:1px solid var(--rule)
}
.back{
  display:inline-flex;align-items:center;gap:var(--s2);height:var(--ctl);
  padding-inline:var(--s2);background:none;border:0;cursor:pointer;
  border-radius:var(--r-sm);color:var(--ink);font-size:var(--t-md)
}
.back:hover{background:var(--hover)}
.brand{display:inline-flex;align-items:center;gap:var(--s2);flex:0 0 auto}
.mark{display:block;width:24px;height:24px;flex:0 0 auto;color:var(--fill)}
.wordmark{font-weight:700;letter-spacing:.16em;font-size:var(--t-md)}
.bar-sep{width:1px;height:20px;background:var(--rule)}
.crumb{color:var(--ink-2);font-size:var(--t-md);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:var(--s2)}

.iconbtn{
  width:var(--ctl);height:var(--ctl);border-radius:var(--r-pill);
  border:var(--bw) solid var(--rule);background:var(--surface);
  display:grid;place-items:center;cursor:pointer;color:var(--ink)
}
.iconbtn:hover{background:var(--surface-3)}
.acct{
  display:flex;align-items:center;gap:var(--s2);cursor:pointer;background:var(--surface);
  border:var(--bw) solid var(--rule);border-radius:var(--r-pill);
  padding:3px var(--s3) 3px 3px;text-align:left;height:var(--ctl)
}
.acct:hover{background:var(--surface-2)}
.avatar{
  width:28px;height:28px;border-radius:var(--r-pill);background:var(--fill);
  color:var(--ink-inverse);display:grid;place-items:center;
  font-size:var(--t-xs);font-weight:700;flex:none;letter-spacing:.02em;line-height:1
}
.acct-name{display:block;font-weight:500;font-size:var(--t-sm);line-height:1.2}
.acct-sub{display:block;font-size:var(--t-xs);color:var(--ink-2);line-height:1.25}
.acct-sub.is-alert{color:var(--danger)}
.dot-state{width:7px;height:7px;border-radius:var(--r-pill);background:var(--ok);flex:none}
.dot-state.is-alert{background:var(--danger)}

/* account menu */
.menu{
  position:absolute;right:var(--s5);top:calc(var(--topbar) + var(--s1));z-index:60;width:310px;
  background:var(--surface);border:1px solid var(--rule);border-radius:var(--r-lg);
  box-shadow:var(--shadow-raised);padding:var(--s1);overflow:hidden
}
.menu-id{display:flex;gap:var(--s3);align-items:center;padding:var(--s3) var(--s3) var(--s4)}
.menu-id .who b{display:block;font-size:var(--t-md);font-weight:500}
.menu-id .who span{display:block;font-size:var(--t-sm);color:var(--ink-2)}
.menu-item{
  width:100%;display:flex;align-items:center;gap:var(--s3);padding:var(--s2) var(--s3);
  border:0;background:none;cursor:pointer;border-radius:var(--r-sm);
  font-size:var(--t-md);text-align:left;color:var(--ink);min-height:var(--ctl)
}
.menu-item:hover{background:var(--hover)}
.menu-item > svg{color:var(--ink-2)}
.menu-item .tail{margin-left:auto;font-size:var(--t-sm);color:var(--ink-2);white-space:nowrap}
.menu-rule{height:1px;background:var(--rule);margin:var(--s1) var(--s1)}

/* ══ layout ════════════════════════════════════════════════════════════ */
.screen{padding:var(--s5) var(--s6) 88px}
@media (max-width:640px){
  .screen{padding:var(--s4) var(--s4) 96px}
  .topbar{padding-inline:var(--s3);gap:var(--s2)}
  .menu{right:var(--s3);width:auto;left:var(--s3)}
}
.eyebrow{color:var(--ink-2);font-size:var(--t-md)}
h1.title{font-size:var(--t-xl);font-weight:500;margin:var(--s1) 0 0;letter-spacing:-.01em;text-wrap:balance}
.head-row{display:flex;align-items:flex-end;gap:var(--s4);flex-wrap:wrap;margin-bottom:var(--s5)}
.head-row .spacer{margin-left:auto}
.stack{display:flex;flex-direction:column;gap:var(--s4)}
.stack-sm{display:flex;flex-direction:column;gap:var(--s3)}
p.prose{margin:0;line-height:1.6}

/* ══ buttons · one height ══════════════════════════════════════════════ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);
  height:var(--ctl);padding:0 var(--s4);border-radius:var(--r-pill);cursor:pointer;
  border:var(--bw) solid var(--ink);background:var(--surface);color:var(--ink);
  font-size:var(--t-sm);font-weight:500;white-space:nowrap
}
.btn:hover{background:var(--surface-3)}
.btn--primary{background:var(--fill);border-color:var(--fill);color:var(--ink-inverse)}
.btn--primary:hover{background:var(--fill-hover);border-color:var(--fill-hover)}
.btn--quiet{border-color:var(--rule);color:var(--ink-2)}
.btn--quiet:hover{color:var(--ink)}
.btn--danger{border-color:var(--danger);color:var(--danger)}
.btn--danger:hover{background:var(--danger-dim)}
.btn--ghost{border-color:transparent;background:none;color:var(--ink-2)}
.btn--ghost:hover{background:var(--hover);color:var(--ink)}
.btn[disabled]{
  background:var(--surface-3);border-color:var(--surface-3);color:var(--ink-3);cursor:not-allowed
}
.gear{
  width:var(--ctl);height:var(--ctl);border-radius:var(--r-pill);border:1px solid var(--rule);
  background:var(--surface);display:grid;place-items:center;cursor:pointer;flex:none;color:var(--ink-2)
}
.gear:hover{background:var(--surface-3);color:var(--ink)}

/* ══ panels ════════════════════════════════════════════════════════════ */
.panel{
  background:var(--surface);border:1px solid var(--rule);
  border-radius:var(--r-lg);box-shadow:var(--shadow-card);overflow:hidden
}
.panel--live{border-color:var(--rule-strong)}
.panel__head{
  display:flex;align-items:center;gap:var(--s3);min-height:48px;
  padding:var(--s2) var(--s5);border-bottom:1px solid var(--rule)
}
.panel__head .spacer{margin-left:auto}
.panel__body{padding:var(--s4) var(--s5) var(--s5)}
.panel__foot{
  display:flex;gap:var(--s2);justify-content:flex-end;align-items:center;
  padding:var(--s3) var(--s5);border-top:1px solid var(--rule);background:var(--surface-2)
}
.factlist{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:var(--s2)}
.factlist li{position:relative;padding-left:18px;font-size:var(--t-sm);color:var(--ink-2)}
.factlist li::before{content:"";position:absolute;left:2px;top:8px;width:5px;height:5px;
                     border-radius:var(--r-pill);background:var(--ink-3)}
.nowbox{
  display:flex;align-items:baseline;gap:var(--s2);border:1px solid var(--rule);
  border-radius:var(--r-md);background:var(--surface-2);padding:var(--s3) var(--s4)
}
.nowbox b{font-size:var(--t-lg);font-weight:500;line-height:1}
.nowbox span{font-size:var(--t-sm);color:var(--ink-2)}

/* setting rows */
.rows{
  background:var(--surface);border:1px solid var(--rule);border-radius:var(--r-lg);
  box-shadow:var(--shadow-card);padding-inline:var(--s5)
}
.row{display:flex;align-items:center;gap:var(--s4);padding:var(--s3) 0;
     border-bottom:1px solid var(--rule);min-height:60px}
.row:last-child{border-bottom:0}
.row__main b{display:block;font-weight:500;font-size:var(--t-md)}
.row__main .sub{display:block;margin-top:2px}
.row__main .warnline{display:block;margin-top:2px;color:var(--warn);font-size:var(--t-sm)}
.row__ctl{margin-left:auto;display:flex;align-items:center;gap:var(--s2);flex-wrap:nowrap}
.unit{color:var(--ink-3);font-size:var(--t-sm);white-space:nowrap}
@media (max-width:640px){
  .row{flex-direction:column;align-items:flex-start;gap:var(--s2)}
  .row__ctl{margin-left:0;flex-wrap:wrap}
}

/* ══ fields ════════════════════════════════════════════════════════════ */
.field{display:flex;flex-direction:column;gap:var(--s2)}
.field > .sub{margin-top:-2px}
input[type=text],input[type=email],input[type=password],input[type=number],
input[type=date],input[type=time],input[type=datetime-local],textarea,select{
  background:var(--surface-2);border:1px solid var(--rule);color:var(--ink);
  border-radius:var(--r-sm);padding:0 var(--s3);height:var(--ctl);width:100%;font-size:var(--t-md)
}
textarea{resize:vertical;min-height:120px;height:auto;padding:var(--s3);line-height:1.6}
input[readonly]{color:var(--ink-2)}
input[aria-invalid="true"]{border-color:var(--danger)}
.num{width:84px;text-align:right}
.time{width:124px}
select{appearance:none;padding-right:var(--s6);cursor:pointer}
.select-wrap{position:relative;display:block}
.select-wrap::after{
  content:"";position:absolute;right:14px;top:50%;width:7px;height:7px;pointer-events:none;
  border-right:1.6px solid var(--ink-2);border-bottom:1.6px solid var(--ink-2);
  transform:translateY(-70%) rotate(45deg)
}
.w-sm{max-width:320px}
.w-md{max-width:22rem}

/* segmented + days */
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:var(--r-sm);
     overflow:hidden;background:var(--surface);height:var(--ctl)}
.seg button{border:0;background:none;cursor:pointer;padding:0 var(--s3);
            font-size:var(--t-sm);color:var(--ink-2);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--fill);color:var(--ink-inverse);font-weight:500}
.days{display:flex;gap:6px;flex-wrap:wrap}
.days button{
  min-width:44px;height:var(--ctl);border-radius:var(--r-sm);cursor:pointer;font-size:var(--t-sm);
  border:1px solid var(--rule);background:var(--surface);color:var(--ink-2)
}
.days button[aria-pressed="true"]{background:var(--fill);border-color:var(--fill);color:var(--ink-inverse)}

.tabs{display:inline-flex;border:1px solid var(--rule);border-radius:var(--r-sm);
      overflow:hidden;background:var(--surface);height:var(--ctl)}
.tabs button{border:0;background:none;cursor:pointer;padding:0 var(--s4);
             font-size:var(--t-sm);color:var(--ink-2);white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--fill);color:var(--ink-inverse);font-weight:500}

/* ══ badges ════════════════════════════════════════════════════════════ */
.badge{
  display:inline-flex;align-items:center;border-radius:var(--r-pill);padding:3px var(--s3);
  font-size:var(--t-xs);font-weight:500;border:1px solid var(--rule-strong);
  color:var(--ink-2);background:var(--surface);white-space:nowrap
}
.badge--solid{background:var(--fill);border-color:var(--fill);color:var(--ink-inverse)}
.badge--warn{color:var(--warn);border-color:var(--warn-edge);background:var(--warn-dim)}
.badge--danger{color:var(--danger);border-color:var(--danger-edge);background:var(--danger-dim)}
.badge--off{color:var(--ink-2);background:var(--surface-3);border-color:var(--rule)}

/* ══ alert strips ══════════════════════════════════════════════════════ */
.alert{
  display:flex;gap:var(--s4);align-items:center;padding:var(--s3) var(--s4);
  border-radius:var(--r-md);border:var(--bw) solid var(--warn-edge);
  background:var(--surface)
}
.alert b{display:block;color:var(--warn);font-size:var(--t-md);font-weight:500}
.alert p{margin:var(--s1) 0 0;color:var(--ink-2);font-size:var(--t-sm);line-height:1.5}
.alert .spacer{margin-left:auto}
.alert--danger{border-color:var(--danger-edge)}
.alert--danger b{color:var(--danger)}
.alert--live{border-color:var(--rule-strong)}
.alert--live b{color:var(--ink)}
@media (max-width:640px){.alert{flex-direction:column;align-items:flex-start}.alert .spacer{margin-left:0}}

/* ══ console ═══════════════════════════════════════════════════════════ */
/* the schedule · one row per feature, three aligned columns.
   It was five sentences that differed by two words each, so nothing scanned. */
.schedule__row{
  display:grid;grid-template-columns:minmax(0,1fr) 116px 186px;gap:var(--s4);
  align-items:center;padding:var(--s3) var(--s5);border-top:1px solid var(--rule)
}
.schedule__row:first-child{border-top:0}
.schedule__name{font-size:var(--t-md)}
.schedule__what{font-size:var(--t-sm);color:var(--ink-2);text-align:right}
.schedule__when{font-size:var(--t-sm);color:var(--ink-2)}
.schedule__empty{padding:var(--s4) var(--s5)}
@media (max-width:720px){
  .schedule__row{grid-template-columns:1fr;gap:2px}
  .schedule__what,.schedule__when{text-align:left}
}
.controls{display:flex;flex-direction:column;gap:var(--s3)}
.frow{
  display:flex;align-items:center;gap:var(--s3);min-height:64px;
  padding:var(--s3) var(--s3) var(--s3) var(--s5);background:var(--surface);
  border:var(--bw) solid var(--rule);border-radius:var(--r-lg);position:relative
}
.frow.is-running{background:var(--live-tint);border-color:var(--live-edge)}
.frow.is-running::before{
  content:"";position:absolute;left:0;top:10px;bottom:10px;width:4px;
  border-radius:0 4px 4px 0;background:var(--live-ink)
}
.frow__dot{width:8px;height:8px;border-radius:var(--r-pill);flex:none;
           border:1.5px solid var(--ink-3);background:transparent}
.frow.is-running .frow__dot{background:var(--live-ink);border-color:var(--live-ink);
                            animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.frow__wrap{display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap;min-width:0}
.frow__name{font-size:var(--t-md);font-weight:500}
.frow__meta{color:var(--ink-2);font-size:var(--t-sm)}   /* was ink-3 · 2.6:1 */
.frow__ctl{margin-left:auto;display:flex;align-items:center;gap:var(--s2);flex:none}
@media (max-width:720px){
  .frow{flex-direction:column;align-items:flex-start}
  .frow__ctl{margin-left:0;width:100%;justify-content:flex-end}
}

.stats-row{display:grid;grid-template-columns:1fr 1fr;gap:var(--s4);margin-top:var(--s5)}
@media (max-width:720px){.stats-row{grid-template-columns:1fr}}
.stat-card{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r-lg);
           padding:var(--s5);box-shadow:var(--shadow-card)}
.stat-value{font-size:var(--t-2xl);font-weight:500;letter-spacing:-.02em;line-height:1.1}
.stat-label{color:var(--ink-2);font-size:var(--t-sm);margin-top:var(--s2)}

/* ══ dialogs ═══════════════════════════════════════════════════════════ */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:70}
.modal{
  position:fixed;z-index:71;left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(880px,calc(100vw - var(--s6)));max-height:calc(100vh - var(--s6));overflow:auto;
  background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow-modal)
}
.modal--narrow{width:min(460px,calc(100vw - var(--s6)))}
.modal--wide{width:min(1180px,calc(100vw - var(--s6)))}
.modal__head{padding:var(--s4) var(--s5);border-bottom:1px solid var(--rule)}
.modal__head h2{margin:0;font-size:var(--t-lg);font-weight:500}
.modal__body{padding:var(--s5)}
.modal__foot{display:flex;gap:var(--s2);justify-content:flex-end;padding:0 var(--s5) var(--s5)}

/* plan comparison · a real table so every row shares one height across the
   four columns, with each plan column painted as a card. Monochrome: the
   choice is carried by fill and border, never by a second hue. */
.only-narrow{display:none}
@media (max-width:860px){
  .only-wide{display:none}
  .only-narrow{display:block}
}

table.plans{
  width:100%;border-collapse:separate;border-spacing:var(--s3) 0;
  table-layout:fixed;margin-inline:calc(var(--s3) * -1)
}
table.plans col.plans__labels{width:210px}

.plans__rowlbl{
  text-align:left;font-weight:400;font-size:var(--t-sm);color:var(--ink);
  padding:var(--s3) var(--s3) var(--s3) 0;vertical-align:middle
}
.plans__rowlbl--foot{color:var(--ink-2)}

/* every cell of a plan column shares these · the row divider is border-top */
.pcol{
  background:var(--surface-2);border-left:1px solid var(--rule);
  border-right:1px solid var(--rule);border-top:1px solid var(--rule);
  padding:var(--s3) var(--s4);vertical-align:middle;text-align:left
}
.pcol--head{border-radius:var(--r-lg) var(--r-lg) 0 0;padding:var(--s4);vertical-align:bottom}
.pcol--foot{border-radius:0 0 var(--r-lg) var(--r-lg);border-bottom:1px solid var(--rule)}
.pcol.is-on{background:var(--surface);border-left-color:var(--ink);border-right-color:var(--ink)}
.pcol--head.is-on{border-top-color:var(--ink)}
.pcol--foot.is-on{border-bottom-color:var(--ink)}

.pcol__flag{display:block;min-height:24px}
.pcol__name{display:block;font-size:var(--t-lg);font-weight:500;line-height:1.2;margin-top:var(--s2)}
.pcol__sum{display:block;font-size:var(--t-sm);color:var(--ink-2);margin-top:2px;min-height:2.6em}
.pcol__cost{display:flex;align-items:baseline;gap:6px;margin-top:var(--s3)}
.pcol__cost b{font-size:var(--t-xl);font-weight:500;letter-spacing:-.01em;line-height:1}
.pcol__cost span{font-size:var(--t-sm);color:var(--ink-2)}
.pcol__writes{display:block;font-size:var(--t-sm);color:var(--ink-2);margin-top:2px}
.pcol--head .btn{width:100%;margin-top:var(--s3)}
.pcol__v{display:block;font-size:var(--t-md);font-weight:500}
.pcol__q{display:block;font-size:var(--t-sm);color:var(--ink-2);margin-top:1px}
.pcol__off{display:block;font-size:var(--t-md);color:var(--ink-3)}

/* the same three plans, stacked, for a phone */

.plan-card__head{padding:var(--s4);border-bottom:1px solid var(--rule)}
.plan-card__row{display:flex;align-items:baseline;gap:var(--s3);
                padding:var(--s3) var(--s4);border-top:1px solid var(--rule)}
.plan-card__row:first-of-type{border-top:0}
.plan-card__row dt{flex:1;font-size:var(--t-sm);color:var(--ink-2);margin:0}
.plan-card__row dd{margin:0;text-align:right}
.checkrow{

  border-radius:var(--r-md);padding:var(--s3) var(--s4);cursor:pointer
}
.checkrow:hover{background:var(--surface-2)}
.checkrow input{margin:3px 0 0;width:16px;height:16px;flex:none;accent-color:var(--fill)}
.checkrow b{display:block;font-weight:500;font-size:var(--t-md)}
.checkrow .sub{display:block;margin-top:2px}

/* ══ tables ════════════════════════════════════════════════════════════ */
.tablewrap{overflow-x:auto}
table.data{width:100%;border-collapse:collapse;font-size:var(--t-sm)}
table.data th{
  text-align:left;font-size:var(--t-xs);letter-spacing:.12em;text-transform:uppercase;

}
table.data td{padding:var(--s3) var(--s4);border-bottom:1px solid var(--rule);vertical-align:middle}
table.data tr:last-child td{border-bottom:0}
table.data a{color:inherit;text-decoration:underline;text-underline-offset:3px}
.detail-fail{color:var(--danger)}

.filters{

.filters .spacer{margin-left:auto}
.filters input[type=date]{width:auto}
.filters .select-wrap{display:inline-block}
.filters select{width:auto}

/* ══ posts ═════════════════════════════════════════════════════════════ */
.draft{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r-lg);

.draft__foot{display:flex;gap:var(--s2);align-items:center;padding:0 var(--s4) var(--s4);flex-wrap:wrap}
.draft__foot .spacer{margin-left:auto}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:var(--s4);align-items:start}

.imgslot{

.kv dt{font-size:var(--t-xs);letter-spacing:.12em;text-transform:uppercase;

.kv dd{margin:0;font-size:var(--t-md)}

.mixrow{display:grid;grid-template-columns:200px 1fr auto;gap:var(--s4);align-items:center;

.actionbar{

.index-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(208px,1fr));gap:var(--s2)}

.index-section + .index-section{margin-top:var(--s5)}

                    text-transform:uppercase;color:var(--ink-2);font-weight:500}

<script>
"use strict";

/* ══ icons · one 20px grid, 1.5 stroke, round caps ════════════════════ */
const P = {

  linkedin:'<rect x="3" y="3" width="18" height="18" rx="4.2" fill="currentColor" stroke="none"/>'
    + '<rect x="6.7" y="10" width="2.1" height="7.1" rx=".4" fill="var(--surface)" stroke="none"/>'
    + '<circle cx="7.75" cy="7.4" r="1.32" fill="var(--surface)" stroke="none"/>'

};
const icon = (n, size = 20) =>
  `<svg viewBox="0 0 24 24" width="${size}" height="${size}" fill="none" stroke="currentColor"
        stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">${P[n]}</svg>`;

/* ══ data ═════════════════════════════════════════════════════════════ */
const FEATURES = [
  { key:'like', name:'Like follower posts', verb:'like', unit:'likes', cycle:'day',
    used:93, limit:150, detected:120, batchNow:10, batchSched:20, from:'09:00', to:'18:00', days:[1,1,1,1,1,0,0] },
  { key:'comment', name:'Comment on follower posts', verb:'comment on', unit:'comments', cycle:'day',
    used:128, limit:150, detected:120, batchNow:3, batchSched:6, from:'09:00', to:'18:00', days:[1,1,1,1,1,0,0] },
  { key:'page-invite', name:'Invite connections to follow a company page', verb:'send', unit:'invitations', cycle:'month',
    used:250, limit:250, detected:250, batchNow:4, batchSched:8, from:'09:00', to:'18:00', days:[1,1,1,1,1,0,0] },
  { key:'connect', name:'Connect with people in IT', verb:'send', unit:'invitations', cycle:'week',
    used:8, limit:100, detected:60, batchNow:5, batchSched:10, from:'09:00', to:'18:00', days:[1,1,1,1,1,0,0] },
  { key:'news', name:'Post technology news', verb:'publish', unit:'posts', cycle:'day',
    used:1, limit:1, detected:null, batchNow:1, batchSched:1, from:'06:00', to:'09:00', days:[1,1,1,1,1,0,0] },
];

const SCENARIOS = {
  'default':              { label:'Everything running · two features live',   account:'connected',    master:true,  running:['like','comment','news'] },
  'all-paused':           { label:'Master switch off · every feature paused', account:'connected',    master:false, running:[] },
  'account-blocked':      { label:'LinkedIn password rejected',              account:'error',        master:true,  running:[] },
  'account-challenge':    { label:'LinkedIn wants a verification check',     account:'challenge',    master:true,  running:[] },
  'account-unconfigured': { label:'No LinkedIn account set up yet',          account:'unconfigured', master:true,  running:[] },
  'followers-never-synced':{label:'Follower list never fetched',             account:'connected',    master:true,  running:['like','comment','news'], followers:null },
};

const ACCOUNT_COPY = {
  connected:   { badge:'LinkedIn · connected',  alert:false, tail:'connected' },
  error:       { badge:'LinkedIn · needs you',  alert:true,  tail:'password rejected' },

};

const PLANS = [
  { key:'careful', title:'Careful', summary:'a light, very safe day', minutes:95, writes:34,
    rows:[[20,'day',5],[8,'day',2],[1,'day',1],[30,'week',5],[0,'day',0]] },
  { key:'steady', title:'Steady', summary:'the one most accounts run', minutes:240, writes:62,
    rows:[[40,'day',10],[15,'day',3],[1,'day',1],[60,'week',10],[8,'day',4]] },

    rows:[[60,'day',15],[24,'day',4],[2,'day',1],[90,'week',15],[12,'day',6]] },
];
const PLAN_ROWS = ['Like posts','Comment on posts','Publish posts','Connection invitations','Page invitations'];

const DRAFTS = [
  { id:'d1', state:'waiting', written:'13:04', image:false, src:'Hacker News', credit:'@northwindnews',
    text:'A quieter one: the tooling survey everyone quotes changed its methodology this year, which explains most of the swing people are reading as a trend.',

  { id:'d2', state:'waiting', written:'13:02', image:true, src:'Hacker News', credit:'@northwindnews',
    text:"The interesting part of this week's platform release is not the release itself. It is how fast teams moved onto it — three of the four I spoke to had it in staging within a day.",
    why:'Three independent write-ups in five hours' },

];

  posted: { label:'Posted', cls:'' },

const ACTIVITY = [
  { time:'14:32', action:'Like', feature:'like', person:'Petra Novák', link:true, result:'done', detail:'—' },
  { time:'14:31', action:'Comment', feature:'comment', person:'Marek Dvořák', link:true, result:'done', detail:'“Really useful, thanks”' },
  { time:'14:31', action:'Like', feature:'like', person:'Jana Horáková', link:false, result:'skipped', detail:'No post in the last 30 days' },
  { time:'14:29', action:'Comment', feature:'comment', person:'Ondřej Malý', link:false, result:'skipped', detail:'Already commented this cycle' },
  { time:'14:26', action:'Connect invite', feature:'connect', person:'Lucie Pokorná', link:false, result:'failed', detail:'LinkedIn refused — weekly limit reached' },
];

const CONNECTIONS = [
  ['Anna Nguyen','Head of Engineering at Loop','2 Jul',true],
  ['Marek Svoboda','CTO at Bytefield','28 Jun',true],
  ['Priya Raman','Staff Data Engineer','14 Jun',true],
  ['Tuan Le','Founder, Hexa Labs','30 May',false],
];

const CITIES = [['Frankfurt',9],['Singapore',6],['Ho Chi Minh City',4],['Hanoi',2],['Prague',1]];

const S = {
  scenario:'default', running:new Set(['like','comment','news']), schedEnabled:true,
  planChosen:false, planKey:'steady', postsTab:'waiting',
  activityFilter:'all', activityFeature:'', newsTab:'settings',
  connect:'connected',           /* the ConnectPanel state on show */
  connectCode:'', connectConfirm:false, connectReopened:false, connectStarting:false,
};

/* ══ helpers ══════════════════════════════════════════════════════════ */
const h = (s) => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $  = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const feat = (k) => FEATURES.find(f => f.key === k);
const acctState = () => SCENARIOS[S.scenario].account;
const blocked = () => acctState() !== 'connected';

const SCHED_NOUN = { like:'posts', comment:'posts', connect:'invitations', 'page-invite':'invitations', news:'posts' };
const plural = (n, w) => n === 1 ? w.replace(/s$/,'') : w;
const runLine = (f, n) => `${f.verb} ${n} ${plural(n, SCHED_NOUN[f.key])}`;
const DAY_NAMES = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
function daysLabel(f){
  const on = f.days.map((v,i) => v ? i : -1).filter(i => i >= 0);
  if (on.length === 7) return 'every day';
  if (on.length === 0) return 'no days';
  if (on.join() === '0,1,2,3,4') return 'Mon–Fri';
  if (on.join() === '5,6') return 'weekends';
  return on.map(i => DAY_NAMES[i]).join(' ');
}
const cycleWord = (f) => f.cycle === 'day' ? 'today' : f.cycle === 'week' ? 'this week' : 'this month';
function clock(t){
  const [hh, mm] = t.split(':').map(Number);
  return `${hh % 12 === 0 ? 12 : hh % 12}:${String(mm).padStart(2,'0')}${hh >= 12 ? 'pm' : 'am'}`;
}
function featureState(f){
  if (blocked()) return 'needs-you';
  if (!SCENARIOS[S.scenario].master) return 'paused';
  if (S.running.has(f.key)) return 'running';
  if (f.limit - f.used <= 0) return 'quota';
  return 'idle';
}
const spaced = (c) => c.length === 6 ? `${c.slice(0,3)} ${c.slice(3)}` : c;

function alertStrip(kind, title, body){
  const cls = kind === 'stop' ? ' alert--danger' : kind === 'live' ? ' alert--live' : '';
  return `<div class="alert${cls}"><div><b>${h(title)}</b><p>${body}</p></div></div>`;
}

        <div class="row__ctl"><div class="seg"><button type="button" aria-pressed="true">On</button><button type="button" aria-pressed="false">Off</button></div></div></div>
      <div class="row"><div class="row__main"><b>Each time you press Start now</b></div>
        <div class="row__ctl"><input class="num" type="number" value="${f.batchNow}" aria-label="Each time you press Start now"><span class="unit">${h(f.unit)}</span></div></div>
      <div class="row"><div class="row__main"><b>Each scheduled run</b>${
        key === 'news' ? '<span class="sub">1 now plus 1 scheduled is more than the 1 a day. Whichever runs first wins; the other will be cut short or skipped.</span>' : ''}</div>
        <div class="row__ctl"><input class="num" type="number" value="${f.batchSched}" aria-label="Each scheduled run"><span class="unit">${h(f.unit)}</span></div></div>
      <div class="row"><div class="row__main"><b>Between these hours</b></div>

/* ── the supervised sign-in · ConnectPanel, all six states ─────────── */
function connectPanel(){
  const st = S.connect;
  const live = ['provisioning','logging_in','awaiting_otp','awaiting_captcha'].includes(st);
  let body = '';

  if (st === 'awaiting_otp') {
    body = `
      ${alertStrip('warn','LinkedIn emailed you a code','Enter the six digits LinkedIn just sent to this account’s email address.')}
      <div class="field w-sm"><label class="label" for="cx-otp">Verification code</label>
        <input id="cx-otp" inputmode="numeric" autocomplete="one-time-code" value="${h(spaced(S.connectCode))}">
        <span class="sub">Six digits, from the email LinkedIn just sent.</span></div>
      ${S.connectConfirm ? `
        ${alertStrip('warn',`Send ${spaced(S.connectCode)} to LinkedIn?`,'Read it against the email once more. A wrong code makes LinkedIn ask again, and repeated wrong codes can lock the account out.')}
        <div style="display:flex;gap:var(--s2);flex-wrap:wrap">
          <button class="btn btn--primary" data-cx="sent">Yes, send ${h(spaced(S.connectCode))}</button>
          <button class="btn" data-cx="uncheck">Let me check again</button></div>`
      : `<div style="display:flex;gap:var(--s2);flex-wrap:wrap">
          <button class="btn btn--primary" data-cx="check"${S.connectCode.length !== 6 ? ' disabled' : ''}>
            ${S.connectCode.length === 6 ? 'Continue' : `${S.connectCode.length} of 6 digits`}</button>
          <button class="btn" data-cx="idle">Stop</button></div>`}`;
  } else if (st === 'awaiting_captcha') {
    body = `${alertStrip('warn','LinkedIn is asking for a security check','Someone at Northwind has to clear it by hand. Leave this page open.')}
      <p class="sub prose">Nothing is wrong with your account. This happens on a first sign-in and is cleared by a person, not by retrying — retrying is what makes it worse.</p>
      <div><button class="btn" data-cx="idle">Stop</button></div>`;
  } else if (st === 'provisioning' || st === 'logging_in') {
    body = `${alertStrip('live','Signing in','Opening LinkedIn and entering the details.')}
      <p class="sub prose">This takes a minute or so. The details are typed at human speed on purpose — LinkedIn notices anything faster.</p>
      <div><button class="btn" data-cx="idle">Stop</button></div>`;
  } else if (st === 'connected' && !S.connectReopened) {
    body = `${alertStrip('live','Connected','connected · exit 42.113.2.43 (Hanoi, VN)')}
      <p class="sub prose">Sign in again if LinkedIn has signed this account out, or to point the bot at a different account. Expect another verification code.</p>
      <div><button class="btn" data-cx="reopen">Sign in again</button></div>`;
  } else {
    const failed = st === 'failed';
    body = `${failed ? alertStrip('stop','LinkedIn did not accept that password',
        'Please double-check it. It has to be your <b>LinkedIn</b> password, not your Google or email one.') : ''}
      ${S.connectStarting ? `
        ${alertStrip('warn','Start signing in to LinkedIn?','We will open LinkedIn as alex.morgan@northwind.example from Ho Chi Minh City, and type these details at human speed. LinkedIn will then email a code to that address, and this page will ask you for it.')}
        <div style="display:flex;gap:var(--s2);flex-wrap:wrap">
          <button class="btn btn--primary" data-cx="awaiting_otp">Yes, sign in now</button>
          <button class="btn" data-cx="unstart">Let me check again</button></div>`
      : `<p class="sub prose">Signing in as <b>alex.morgan@northwind.example</b> with the password already stored. To use different details, change them below first.</p>
        <div class="field w-md"><label class="label" for="cx-city">Where should this account be run from?</label>
          <span class="select-wrap"><select id="cx-city">
            ${CITIES.map(([c,n]) => `<option${c === 'Ho Chi Minh City' ? ' selected':''}>${h(c)}${n > 1 ? ` · ${n} available` : ''}</option>`).join('')}
          </select></span>
          <span class="sub">Pick somewhere close to where you live. LinkedIn ties its trust to the address a sign-in comes from, so one far from home looks like somebody else using your account.</span></div>
        <p class="sub prose">Chosen once and kept — moving it later means another verification code, and looks suspicious to LinkedIn.</p>
        <div><button class="btn btn--primary" data-cx="start">${failed ? 'Try again' : 'Sign in to LinkedIn'}</button></div>`}
      <p class="sub prose">After the details go in, LinkedIn emails a verification code to that account. Have the inbox open — this page will wait and ask you for it, and the code is only good for a few minutes.</p>`;
  }

  return `<div class="panel${live ? ' panel--live' : ''}">
    <div class="panel__head"><span class="label">Connect this account to LinkedIn</span>
      <span class="spacer"></span><span class="meta">${h(st.replace('_',' '))}</span></div>
    <div class="panel__body stack-sm">${body}</div></div>`;
}

function planCell(p, i){
  const [per, period, run] = p.rows[i];
  return per <= 0 ? '<span class="pcol__off">off</span>'
    : `<span class="pcol__v">${per} a ${period}</span><span class="pcol__q">${run} per run</span>`;
}

function planHead(p, tag){
  const on = S.planKey === p.key;
  const cls = tag === 'th' ? `pcol pcol--head${on ? ' is-on' : ''}` : 'plan-card__head';
  return `<${tag} class="${cls}" scope="col">
    <span class="pcol__flag">${p.key === 'steady' ? '<span class="badge badge--solid">Most accounts</span>' : ''}</span>

            aria-pressed="${on}" data-plan="${p.key}">${on ? 'Chosen' : 'Choose ' + h(p.title)}</button>
  </${tag}>`;
}

  return `<p class="prose" style="margin-bottom:var(--s4)">${S.planChosen

/* ══ router ═══════════════════════════════════════════════════════════ */
let route = { name:'console', arg:null };
const CRUMBS = { console:'Console', linkedin:'LinkedIn account', followers:'Followers',
                 posts:'Posts', draft:'Draft', activity:'Activity', plan:'Plan', settings:'Settings' };

function go(target){
  const [name, arg] = String(target).split(':');
  route = { name, arg: arg || null };
  closeMenu(); closeOverlay();
  if (AUTH[name]) { renderAuth(); return; }
  render();
  window.scrollTo(0, 0);
}

function renderAuth(){
  $('#app').hidden = true;
  const host = $('#authHost'); host.hidden = false;
  host.innerHTML = AUTH[route.name](route.arg === 'err');
}

function menuHTML(){
  const copy = ACCOUNT_COPY[acctState()];
  return `<div class="menu-id"><span class="avatar">AM</span>
      <span class="who"><b>Alex Morgan</b><span>alex.morgan@northwind.example</span></span></div>
    <button class="menu-item" data-go="linkedin">${icon('linkedin')} LinkedIn account
      <span class="tail">${h(copy.tail)}</span></button>
    <button class="menu-item" data-go="plan">${icon('plan')} Plan</button>
    <button class="menu-item" data-go="settings">${icon('gear')} Settings</button>
    <div class="menu-rule"></div>
    <button class="menu-item" data-go="login">${icon('signout')} Sign out</button>`;
}

function render(){
  $('#authHost').hidden = true; $('#app').hidden = false;
  const { name, arg } = route;
  $('#crumb').textContent = name === 'feature' ? feat(arg).name : (CRUMBS[name] || 'Console');

  const back = $('#backBtn');
  back.hidden = name === 'console';
  back.innerHTML = icon('back', 18) + 'Back';

  const copy = ACCOUNT_COPY[acctState()];
  $('#acctSub').textContent = copy.badge;
  $('#acctSub').classList.toggle('is-alert', copy.alert);
  $('#acctDot').classList.toggle('is-alert', copy.alert);
  $('#acctMenu').innerHTML = menuHTML();

  $('#main').innerHTML = name === 'feature' ? SCREENS.feature(arg)
                       : name === 'draft' ? SCREENS.draft(arg)
                       : (SCREENS[name] || SCREENS.console)();

  if (name === 'console' && !S.planChosen) openPlanModal();
}

      <div class="index-section"><h3>Account state</h3><div class="index-grid">
        ${Object.entries(SCENARIOS).map(([k,v]) => `<button data-scenario="${k}"
          style="${S.scenario === k ? 'border-color:var(--ink)' : ''}"><b>${h(k)}</b><span>${h(v.label)}</span></button>`).join('')}
      </div></div>
      <div class="index-section"><h3>Connect flow</h3><div class="index-grid">
        ${CONNECT_STATES.map(([k,l]) => `<button data-cxgo="${k}"
          style="${S.connect === k ? 'border-color:var(--ink)' : ''}"><b>${h(l)}</b><span>${h(k)}</span></button>`).join('')}
      </div></div>
    </div>
    <div class="modal__foot"><button class="btn btn--ghost" data-close>Close</button></div></div>`);
}

/* ══ events ═══════════════════════════════════════════════════════════ */
const closeMenu = () => {
  $('#acctMenu').hidden = true;
  $('#acctBtn').setAttribute('aria-expanded','false');
};

function setTheme(){
  const dark = document.documentElement.getAttribute('data-theme') === 'dark'
    || (!document.documentElement.getAttribute('data-theme') && matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.setAttribute('data-theme', dark ? 'light' : 'dark');
  const b = $('#themeBtn');
  b.setAttribute('aria-label', dark ? 'Switch to dark mode' : 'Switch to light mode');
  b.innerHTML = icon(dark ? 'moon' : 'sun', 18);
}

document.addEventListener('click', (e) => {
  const t = e.target;
  if (t.closest('[data-close]')) return closeOverlay();
  if (t.closest('[data-scrim]')) {
    if (!S.planChosen && route.name === 'console') return;
    return closeOverlay();
  }

  const g = t.closest('[data-go]');
  if (g) { e.preventDefault(); return go(g.dataset.go); }
  const a = t.closest('[data-auth]');
  if (a) { e.preventDefault(); return go(a.dataset.auth); }

  if (t.closest('#backBtn')) return go('console');
  if (t.closest('#acctBtn')) {
    const m = $('#acctMenu'); m.hidden = !m.hidden;
    $('#acctBtn').setAttribute('aria-expanded', String(!m.hidden)); return;
  }
  if (!t.closest('#acctMenu')) closeMenu();
  if (t.closest('#themeBtn')) return setTheme();

  const sc = t.closest('[data-scenario]');
  if (sc) { S.scenario = sc.dataset.scenario; S.running = new Set(SCENARIOS[S.scenario].running);
            S.connect = SCENARIOS[S.scenario].account === 'connected' ? 'connected' : 'failed';
            return go('console'); }

  const cg = t.closest('[data-cxgo]');
  if (cg) { S.connect = cg.dataset.cxgo; S.connectReopened = false; S.connectStarting = false;
            S.connectCode = ''; S.connectConfirm = false; return go('linkedin'); }

  const cx = t.closest('[data-cx]');
  if (cx) {
    const v = cx.dataset.cx;
    if (v === 'reopen') S.connectReopened = true;
    else if (v === 'start') S.connectStarting = true;
    else if (v === 'unstart') S.connectStarting = false;
    else if (v === 'check') S.connectConfirm = true;
    else if (v === 'uncheck') S.connectConfirm = false;
    else if (v === 'sent') { S.connect = 'connected'; S.connectReopened = false; S.connectCode = ''; S.connectConfirm = false; }
    else { S.connect = v; S.connectStarting = false; S.connectReopened = false; }
    return render();
  }

  const st = t.closest('[data-start]');
  if (st) { S.running.add(st.dataset.start); return render(); }
  const sp = t.closest('[data-stop]');
  if (sp) { S.running.delete(sp.dataset.stop); return render(); }
  if (t.closest('#schedBtn')) { S.schedEnabled = !S.schedEnabled; return render(); }

  const pl = t.closest('[data-plan]');
  if (pl) { S.planKey = pl.dataset.plan;
            return overlay.querySelector('.modal') ? openPlanModal() : render(); }
  if (t.closest('#acceptPlan')) { S.planChosen = true; closeOverlay(); return render(); }

  const tb = t.closest('[data-tab]');
  if (tb) { S.postsTab = tb.dataset.tab; return render(); }
  const nt = t.closest('[data-newstab]');
  if (nt) { S.newsTab = nt.dataset.newstab; return render(); }
  const af = t.closest('[data-afilter]');
  if (af) { S.activityFilter = af.dataset.afilter; return render(); }

  const dy = t.closest('[data-day]');
  if (dy) { const [k,i] = dy.dataset.day.split(':'); feat(k).days[+i] ^= 1;
            dy.setAttribute('aria-pressed', String(!!feat(k).days[+i])); return; }

  const sg = t.closest('.seg button');
  if (sg) { $$('button', sg.parentElement).forEach(b => b.setAttribute('aria-pressed','false'));
            sg.setAttribute('aria-pressed','true'); return; }

  const po = t.closest('[data-post]');
  if (po) { const d = DRAFTS.find(x => x.id === po.dataset.post);
            if (d) { d.state = 'posted'; d.written = '16:1' + Math.floor(Math.random()*9); }
            S.postsTab = 'posted'; return go('posts'); }
  const sk = t.closest('[data-skip]');
  if (sk) { const d = DRAFTS.find(x => x.id === sk.dataset.skip);
            if (d) d.state = 'skipped'; S.postsTab = 'skipped'; return go('posts'); }

  if (t.closest('#writeNow')) {
    DRAFTS.unshift({ id:'d' + (DRAFTS.length + 1), state:'waiting', written:'16:18', image:false,
      src:'Hacker News', credit:'@northwindnews',
      text:'Written just now: the quiet story this week is how much of the “agent” tooling is really a scheduler with better copy.',
      why:'Written on request, not picked from the feed' });
    S.postsTab = 'waiting'; return render();
  }

  if (t.closest('#checkNow')) return confirmDialog('Checking the sign-in',
    'We are signing in as you on the automation machine. This takes 30 to 60 seconds and nothing else runs while it happens.','Leave it running');
  if (t.closest('#disconnectBtn')) return confirmDialog('Disconnect this LinkedIn account?',
    'The five features stop immediately and the sign-in details are deleted. Your LinkedIn account itself is untouched.','Disconnect', true);
  if (t.closest('#signOutBtn')) return confirmDialog('Sign out of this browser?',
    'The session here is cleared and ended on the server. Scheduled runs keep going — signing out does not stop the automation.','Sign out');
  if (t.closest('#deleteBtn')) return confirmDialog('Delete this Perpetua account?',
    'Every draft, the run history, the follower list and the stored LinkedIn password go with it. This cannot be undone.','Delete it', true);
  if (t.closest('#doLogin')) { S.planChosen = false; return go('console'); }
});

document.addEventListener('input', (e) => {
  const t = e.target;
  if (t.dataset.mix !== undefined || t.dataset.mixnum !== undefined) {
    const i = t.dataset.mix ?? t.dataset.mixnum, box = $('#mixBody');
    $(`[data-mix="${i}"]`, box).value = t.value;
    $(`[data-mixnum="${i}"]`, box).value = t.value;
    const total = [0,1,2].reduce((s,n) => s + Number($(`[data-mix="${n}"]`, box).value), 0);
    $('#mixTotal').textContent = total + '%';
    const pill = $('#mixPill');
    pill.textContent = 'Total ' + total + '%';
    pill.className = 'badge' + (total === 100 ? '' : ' badge--warn');
    return;
  }
  if (t.id === 'note') $('#noteCount').textContent = `${t.value.length} / 200`;
  if (t.id === 'draftText') $('#draftCount').textContent = `${t.value.length} / 3,000`;
  if (t.id === 'afeature') { S.activityFeature = t.value; render(); }
  if (t.id === 'cx-otp') { S.connectCode = t.value.replace(/\D/g,'').slice(0,6); S.connectConfirm = false; render(); }
  if (t.id === 'fontPick') {
    const m = { 'DM Sans':'"DM Sans"', 'Inter':'Inter', 'Source Sans 3':'"Source Sans 3"',
                'Geist':'Geist', 'Manrope':'Manrope', 'Atkinson Hyperlegible':'"Atkinson Hyperlegible"' };
    document.documentElement.style.setProperty('--font-ui', `${m[t.value]}, "DM Sans", system-ui, sans-serif`);
  }
});

document.addEventListener('keydown', (e) => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName);
  if (e.key === '?' && !typing) { e.preventDefault(); return openIndex(); }
  if (e.key !== 'Escape') return;
  if (!S.planChosen && route.name === 'console' && overlay.querySelector('.modal')) return;
  closeOverlay(); closeMenu();
});

$('#themeBtn').innerHTML = icon('moon', 18);
render();
</script>
</body>
</html>
